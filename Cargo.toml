[workspace]
members = ["crates/core", "crates/cli", "crates/cuda"]
resolver = "3"
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Victor Lopez <vhrlopes@gmail.com>"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.7"
msgpacker = "0.7.1"
rand = "0.10.3"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wide = "1.7.1"
